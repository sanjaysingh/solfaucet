name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
            worker:
              - 'worker/**'
              - 'shared/**'

  worker:
    name: Worker CI
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_FAUCET_API_URL: https://example.invalid
          VITE_TURNSTILE_SITE_KEY: test-site-key

  ci:
    name: CI
    needs: [changes, worker, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require passing checks for changed packages
        run: |
          frontend="${{ needs.changes.outputs.frontend }}"
          worker="${{ needs.changes.outputs.worker }}"
          frontend_result="${{ needs.frontend.result }}"
          worker_result="${{ needs.worker.result }}"

          if [ "$worker" = "true" ] && [ "$worker_result" != "success" ]; then
            echo "Worker CI failed or was skipped unexpectedly (result=$worker_result)"
            exit 1
          fi
          if [ "$frontend" = "true" ] && [ "$frontend_result" != "success" ]; then
            echo "Frontend CI failed or was skipped unexpectedly (result=$frontend_result)"
            exit 1
          fi

          # PRs that only touch docs/workflows still need a green aggregate check.
          if [ "$worker" != "true" ] && [ "$frontend" != "true" ]; then
            echo "No package changes detected; CI aggregate is green."
          fi
